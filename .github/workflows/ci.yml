name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # evals run on-demand (they call the OpenAI API and cost money)

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Typecheck governed runtime
        run: mypy --ignore-missing-imports --check-untyped-defs kompass/security/oidc.py kompass/actions/executor.py kompass/actions/postgres.py kompass/actions/reconciliation.py kompass/persistence.py kompass/scripts/load_test.py evals/judge.py evals/dataset.py
      - name: Test
        run: pytest -q
      - name: Dependency audit
        run: python -m pip_audit -r requirements-production.txt --progress-spinner off
      - name: Offline agent evaluation gate
        run: python -m evals.offline --ci
      - name: Verify release identity
        run: python -m kompass.release

  # Runs the eval suite on a fixed golden set and fails if the score
  # regresses below the committed threshold. Produces the README badge.
  evals:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ github.event_name == 'workflow_dispatch' }}  # manual — needs OPENAI_API_KEY secret
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # CI runners do not host Ollama; use the configured hosted tiers only for
      # the manually triggered full regression suite.
      KOMPASS_LLM_PROVIDER: openai
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Seed corpus
        run: python -m kompass.scripts.seed
      - name: Run evals (regression gate)
        run: python -m evals.run --ci --min-score 0.75
